info:
  title: inbox-service
  version: v1
  description: |-
    `inbox-service` in the `inbox` specification.

    The one service every client talks to (`inbox serve`). It holds the inboxes and their messages in the backend it was started with, checks every post and every answer through the SignatureVerifier port, and removes a message when it is handled or its `expires` passes.

    The specification declares no transport, so each address below is a name and not a topic on a named broker. Servers, protocol bindings, security schemes, message keys, partitioning, retention and ordering are absent because the model does not state them.
  x-ess-component: inbox-service
  x-ess-provenance:
    system: inbox
    specification_version: v1
    contract_digest: slice-sha256/2:43e481f9e63227e5548459a03d98af38ea413fd4d467b90bad25e4c8b1b8b178
