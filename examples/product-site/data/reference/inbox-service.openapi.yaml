            application/json:
              schema:
                $ref: '#/components/schemas/inbox.messaging.Answer.answered.Response'
        '403':
          description: 'Outcomes `not-sender`, `foreign-message` and `not-recipient`: the caller is not one this branch admits: its guard compares the authenticated caller with the input or the record. The same request from an admitted caller is accepted. Or: the standard refusal for an actor no grant admits: the request was authenticated as no actor, or as one `x-ess-may-invoke` does not list. It is checked before the command runs, so nothing was read, written or published, and the same request from a granted actor is decided by the command. Its body carries `refused` and `actor`, never the `outcome` and `error` a declared branch carries.'
