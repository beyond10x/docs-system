      operationId: inbox.messaging.Answer
      summary: Answer
      description: 'Answer a request or a decision. The input is the reply envelope: its kind is reply and its `to` is the sender of the message it answers. The service checks it as it checks a post.'
      tags:
      - messaging
      x-ess-may-invoke:
      - inbox.messaging.Client
      x-ess-caller:
