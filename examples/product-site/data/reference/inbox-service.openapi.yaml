x-ess-entities:
  inbox.messaging.Adapter:
    title: Adapter
    description: The wake surface the owner of an inbox reads it through.
    x-ess-name: inbox.messaging.Adapter
    x-ess-kind: enum
    type: string
    enum:
    - claude_code
    - metaharness
    - slack
    - terminal
  inbox.messaging.Address:
    title: Address
    description: 'The address of an inbox: `agent:<host>/<session-name>` or `human:<name>`. `group:<name>` is reserved; version 1 opens no group inbox, and a sender that addresses several inboxes posts one envelope to each under one `thread`.'
    x-ess-name: inbox.messaging.Address
    x-ess-kind: newtype
    type: string
  inbox.messaging.AnsweredBy:
    title: AnsweredBy
    description: 'principal: the reply''s `on_behalf_of` answered. silence: nobody answered before `expires`, and the service took the decision''s `default_on_silence` (the convention of `sdc.decision.PrincipalKind`).'
    x-ess-name: inbox.messaging.AnsweredBy
    x-ess-kind: enum
    type: string
    enum:
    - principal
    - silence
  inbox.messaging.Body:
    title: Body
    description: The text of a message or a reply, at most 65536 bytes of UTF-8.
    x-ess-name: inbox.messaging.Body
    x-ess-kind: newtype
    type: string
    x-ess-invariants:
    - value.utf8_bytes <= 65536
  inbox.messaging.DecisionAsk:
    title: DecisionAsk
    description: What a decision asks. The deadline is the envelope's `expires`; the option silence takes is the envelope's `default_on_silence`.
    x-ess-name: inbox.messaging.DecisionAsk
    x-ess-kind: struct
    type: object
    properties:
      options:
        type: array
        items:
          $ref: '#/x-ess-entities/inbox.messaging.DecisionOption'
      recommended_option:
        $ref: '#/x-ess-entities/inbox.messaging.OptionLetter'
      request_ref:
        description: The id of the decision request this envelope carries, where another system records it (for example an `sdc.decision.DecisionRequest`). The inbox never records the decision.
        type: string
    required:
    - options
    additionalProperties: false
  inbox.messaging.DecisionOption:
    title: DecisionOption
    x-ess-name: inbox.messaging.DecisionOption
    x-ess-kind: struct
    type: object
    properties:
      letter:
        $ref: '#/x-ess-entities/inbox.messaging.OptionLetter'
      text:
        type: string
    required:
    - letter
    - text
    additionalProperties: false
  inbox.messaging.DedupKey:
    title: DedupKey
    description: The sender's key for one logical message. A sender with no key of its own writes the message id.
    x-ess-name: inbox.messaging.DedupKey
    x-ess-kind: newtype
    type: string
  inbox.messaging.DelegationId:
    title: DelegationId
    description: The id of a delegation that lets `from` speak for `on_behalf_of`. The SignatureVerifier port resolves it; the inbox stores no delegation.
    x-ess-name: inbox.messaging.DelegationId
    x-ess-kind: newtype
    type: string
  inbox.messaging.FreeShape:
    title: FreeShape
    x-ess-name: inbox.messaging.FreeShape
    x-ess-kind: struct
    type: object
    additionalProperties: false
  inbox.messaging.Inbox:
    title: Inbox
    description: A named address that messages are posted to. It belongs to the principal the address names; only a caller authenticated for the address opens it, closes it or handles its messages.
    x-ess-name: inbox.messaging.Inbox
    x-ess-kind: entity
    type: object
    properties:
      address:
        $ref: '#/x-ess-entities/inbox.messaging.Address'
      owner:
        $ref: '#/x-ess-entities/inbox.messaging.Principal'
        description: The principal that opened the inbox.
      adapter:
        $ref: '#/x-ess-entities/inbox.messaging.Adapter'
      state:
        $ref: '#/x-ess-entities/inbox.messaging.Inbox.State'
    required:
    - address
    - owner
    - adapter
    - state
    additionalProperties: false
  inbox.messaging.Inbox.State:
    title: State
    x-ess-name: inbox.messaging.Inbox.State
    x-ess-kind: enum
    type: string
    enum:
    - Closed
    - Open
  inbox.messaging.Kind:
    title: Kind
    description: 'note: handled when read. request: handled when answered or refused. decision: a request with lettered options, which silence may answer.'
    x-ess-name: inbox.messaging.Kind
    x-ess-kind: enum
    type: string
    enum:
    - note
    - request
    - decision
  inbox.messaging.Message:
    title: Message
    description: One envelope for one inbox, and where its handling stands. The envelope fields never change. `expires` is the instant the service removes the record; an answer replaces it with the reply's own.
    x-ess-name: inbox.messaging.Message
    x-ess-kind: entity
    type: object
    properties:
      message_id:
        $ref: '#/x-ess-entities/inbox.messaging.MessageId'
      from:
        $ref: '#/x-ess-entities/inbox.messaging.Principal'
      on_behalf_of:
        $ref: '#/x-ess-entities/inbox.messaging.Principal'
      authority:
        $ref: '#/x-ess-entities/inbox.messaging.DelegationId'
      to:
        $ref: '#/x-ess-entities/inbox.messaging.Address'
        x-ess-relation:
          name: inbox
          kind: references
          source: inbox.messaging.Message
          target: inbox.messaging.Inbox
          cardinality: one
          via: to
          $ref: '#/x-ess-entities/inbox.messaging.Inbox'
      kind:
        $ref: '#/x-ess-entities/inbox.messaging.Kind'
      thread:
        $ref: '#/x-ess-entities/inbox.messaging.ThreadId'
      reply_shape:
        $ref: '#/x-ess-entities/inbox.messaging.ReplyShape'
      decision:
        $ref: '#/x-ess-entities/inbox.messaging.DecisionAsk'
      default_on_silence:
        $ref: '#/x-ess-entities/inbox.messaging.OptionLetter'
      created:
        type: string
        format: date-time
      expires:
        type: string
        format: date-time
      dedup_key:
        $ref: '#/x-ess-entities/inbox.messaging.DedupKey'
      body:
        $ref: '#/x-ess-entities/inbox.messaging.Body'
      signature:
        $ref: '#/x-ess-entities/inbox.messaging.Signature'
      answered_by:
        $ref: '#/x-ess-entities/inbox.messaging.AnsweredBy'
      decided_option:
        $ref: '#/x-ess-entities/inbox.messaging.OptionLetter'
        description: 'The option a decision was answered with: the reply''s, or `default_on_silence` when silence answered.'
      reply:
        $ref: '#/x-ess-entities/inbox.messaging.Reply'
        description: Absent when silence answered.
      refusal:
        type: string
      state:
        $ref: '#/x-ess-entities/inbox.messaging.Message.State'
    required:
    - message_id
    - from
    - on_behalf_of
    - to
    - kind
    - thread
    - created
    - expires
    - dedup_key
    - body
    - signature
    - state
    additionalProperties: false
  inbox.messaging.Message.State:
    title: State
    x-ess-name: inbox.messaging.Message.State
    x-ess-kind: enum
    type: string
    enum:
    - Answered
    - Delivered
    - Read
    - Refused
    - Sent
  inbox.messaging.MessageId:
    title: MessageId
    description: A ULID the sender sets. A sender that posts a message again sends the same id.
    x-ess-name: inbox.messaging.MessageId
    x-ess-kind: newtype
    type: string
    pattern: ^[0-9A-HJKMNP-TV-Z]*$
    minLength: 26
    maxLength: 26
    x-ess-invariants:
    - value.count == 26
    x-ess-alphabet: 0123456789ABCDEFGHJKMNPQRSTVWXYZ
  inbox.messaging.OptionLetter:
    title: OptionLetter
    x-ess-name: inbox.messaging.OptionLetter
    x-ess-kind: newtype
    type: string
    pattern: ^[A-Z]*$
    minLength: 1
    maxLength: 1
    x-ess-invariants:
    - value.count == 1
    x-ess-alphabet: ABCDEFGHIJKLMNOPQRSTUVWXYZ
  inbox.messaging.Principal:
    title: Principal
    description: 'Who sends, or whose word a message is: `agent:<host>/<session-name>` or `human:<name>`. The SignatureVerifier port decides which key speaks for which principal.'
    x-ess-name: inbox.messaging.Principal
    x-ess-kind: newtype
    type: string
  inbox.messaging.Reply:
    title: Reply
    description: 'The signed reply envelope: the answer to a request or a decision. Its kind is reply, its `in_reply_to` is the message that holds it and its `to` is that message''s sender. It stays on the message it answers until the sender collects it.'
    x-ess-name: inbox.messaging.Reply
    x-ess-kind: struct
    type: object
    properties:
      reply_id:
        $ref: '#/x-ess-entities/inbox.messaging.MessageId'
      from:
        $ref: '#/x-ess-entities/inbox.messaging.Principal'
      on_behalf_of:
        $ref: '#/x-ess-entities/inbox.messaging.Principal'
      authority:
        $ref: '#/x-ess-entities/inbox.messaging.DelegationId'
      created:
        type: string
        format: date-time
      option:
        $ref: '#/x-ess-entities/inbox.messaging.OptionLetter'
      body:
        $ref: '#/x-ess-entities/inbox.messaging.Body'
      signature:
        $ref: '#/x-ess-entities/inbox.messaging.Signature'
    required:
    - reply_id
    - from
    - on_behalf_of
    - created
    - body
    - signature
    additionalProperties: false
  inbox.messaging.ReplyShape:
    title: ReplyShape
    description: 'What a reply to a request must look like. free: any text. lines: at most this many lines. schema: a reference to a JSON Schema the reply body must satisfy.'
    x-ess-name: inbox.messaging.ReplyShape
    x-ess-kind: union
    oneOf:
    - title: free
      type: object
      properties:
        shape:
          type: string
          const: free
        value:
          $ref: '#/x-ess-entities/inbox.messaging.FreeShape'
      required:
      - shape
      - value
      additionalProperties: false
    - title: lines
      type: object
      properties:
        shape:
          type: string
          const: lines
        value:
          type: integer
      required:
      - shape
      - value
      additionalProperties: false
    - title: schema
      type: object
      properties:
        shape:
          type: string
          const: schema
        value:
          type: string
      required:
      - shape
      - value
      additionalProperties: false
    x-ess-union-tag: shape
  inbox.messaging.Signature:
    title: Signature
    description: The key id and the Ed25519 signature over the canonical JSON of every other envelope field.
    x-ess-name: inbox.messaging.Signature
    x-ess-kind: struct
    type: object
    properties:
      key_id:
        type: string
      value:
        type: string
    required:
    - key_id
    - value
    additionalProperties: false
  inbox.messaging.ThreadId:
    title: ThreadId
    description: 'The ULID that ties the envelopes of one fan-out together: a request sent to 11 inboxes is 11 messages with one thread. A message sent to one inbox carries its own id.'
    x-ess-name: inbox.messaging.ThreadId
    x-ess-kind: newtype
    type: string
    pattern: ^[0-9A-HJKMNP-TV-Z]*$
    minLength: 26
    maxLength: 26
    x-ess-invariants:
    - value.count == 26
    x-ess-alphabet: 0123456789ABCDEFGHJKMNPQRSTVWXYZ
