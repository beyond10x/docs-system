          application/json:
            schema:
              $ref: '#/components/schemas/inbox.messaging.Answer.Input'
      responses:
        '202':
          description: 'Outcome `answered`: the branch the specification declares for this input. Events this branch emits are published to consumers and listed under `published`.'
